# Crate layering table (#439, #440). Read by tests/regressions/layering.rs.
#
# The check fails any dependency that points up the layers. Stage A scans the
# modules of the single `junie-tui` package (`src/`) and attributes each file
# to its target crate through [files]. Stage B reads `cargo metadata` once the
# crates exist (`crates/termrock-*`). Both read this one table.
#
# Names are short: `core` means the package `termrock-core`. `termrock` is the
# facade (`crates/termrock`). `junie-tui` is the transitional implementation
# package; #452 turns it into a shim and flips its position here.
#
# Editing rules
#   * [allow] is the table of #439 and changes only by a recorded decision.
#   * An extraction PR (#444 to #448) deletes the [files] entries of the files
#     it moves, because those files then belong to a crate of their own and
#     stage B checks their dependencies. #452 deletes [files] entirely.
#   * [files] is not an allowlist for violations; known violations live in
#     tests/regressions/layering-allowlist.tsv, which may only shrink.

schema = 1

# Crates from the bottom of the stack to the top. A crate may depend only on
# crates listed before it.
order = [
    "metrics",
    "text",
    "core",
    "theme",
    "runtime",
    "session",
    "controls",
    "feedback",
    "overlays",
    "viewport",
    "fields",
    "editors",
    "layout",
    "collections",
    "navigation",
    "grid",
    "dialogs",
    "shell",
    "terminal",
    "cli",
    "catalog",
    "conformance",
    "junie-tui",
    "termrock",
    "functional",
]

# The layer each crate belongs to, lowest first. A dependency may not point to a
# higher layer than its owner.
layer_order = ["foundations", "runtime", "components", "host", "optional", "proof", "facade", "test"]

[layers]
metrics = "foundations"
text = "foundations"
core = "foundations"
theme = "foundations"
runtime = "runtime"
session = "runtime"
controls = "components"
feedback = "components"
overlays = "components"
viewport = "components"
fields = "components"
editors = "components"
layout = "components"
collections = "components"
navigation = "components"
grid = "components"
dialogs = "components"
shell = "host"
terminal = "optional"
cli = "optional"
catalog = "proof"
conformance = "proof"
"junie-tui" = "facade"
termrock = "facade"
functional = "test"

# Direct dependencies each crate may declare (the table in #439). The effective
# permission is this list plus everything those crates may themselves depend on:
# "every row also allows the foundation crates that the row's dependencies
# already use". Applications are not listed; they may depend on `termrock` only.
[allow]
metrics = []
text = ["metrics"]
core = ["metrics", "text"]
theme = ["core"]
runtime = ["metrics", "text", "core", "theme"]
session = ["metrics", "text", "core", "runtime"]
controls = ["metrics", "text", "core", "theme", "runtime"]
feedback = ["controls"]
overlays = ["feedback", "controls"]
viewport = ["overlays", "controls"]
fields = ["overlays", "controls"]
editors = ["viewport", "fields", "overlays", "controls"]
layout = ["viewport", "overlays", "controls"]
collections = ["layout", "fields", "viewport", "overlays", "feedback", "controls"]
navigation = ["collections", "overlays", "controls"]
grid = ["overlays", "feedback", "controls"]
dialogs = ["navigation", "collections", "layout", "editors", "fields", "viewport", "overlays", "controls"]
shell = ["dialogs", "navigation", "overlays", "feedback", "controls", "session", "runtime"]
terminal = ["viewport", "controls", "runtime", "theme", "core", "text", "metrics"]
cli = ["core", "theme"]
catalog = ["grid", "navigation", "collections", "editors", "fields", "viewport", "controls", "session", "runtime", "core"]
conformance = ["metrics", "text", "core", "theme", "runtime", "session", "controls", "feedback", "overlays", "viewport", "fields", "editors", "layout", "collections", "navigation", "grid", "dialogs", "shell", "terminal", "cli", "catalog"]
"junie-tui" = ["metrics", "text", "core", "theme", "runtime", "session", "controls", "feedback", "overlays", "viewport", "fields", "editors", "layout", "collections", "navigation", "grid", "dialogs", "shell", "terminal", "cli", "catalog"]
termrock = ["metrics", "text", "core", "theme", "runtime", "session", "controls", "feedback", "overlays", "viewport", "fields", "editors", "layout", "collections", "navigation", "grid", "dialogs", "shell", "terminal", "cli", "catalog", "conformance", "junie-tui"]
functional = ["termrock"]

# Pre-split stage only: source file to target crate, from the implementation
# maps of #444 to #449. `tests/support/*` is the test support that
# `src/catalog_contract.rs` includes through `#[path]`: #449 moves
# `api_inventory.rs` into `termrock-catalog`, and `scenario_reach.rs`, which only
# `catalog_contract` uses, follows it. The shim modules (`lib.rs`,
# `core/mod.rs`, `ui/mod.rs`, `widgets/mod.rs`) hold only `mod` lines and belong
# to the facade.
[files]

