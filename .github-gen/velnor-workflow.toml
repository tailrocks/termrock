schema = 1
[generator]
repository = "tailrocks/termrock"
revision = "03f9409b3f649a8973169dde0ebba3fe58a92ac9"
[scan]
exclude = ["crates/termrock/src/lib.rs"]
[workflow]
runners = "both"
automatic = "both"
default_dispatch_runner = "github"
automatic_lanes = "github"
github_runner = "ubuntu-24.04"
velnor_labels = ["self-hosted", "velnor-target-mvp"]
default_branch = "main"
[[declare]]
primitive = "release"
file = "release.yml"
[declare.args]
kind = "rust-binary"
package = "termrock"
binary = "termrock"
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
source_repository = "tailrocks/termrock"
