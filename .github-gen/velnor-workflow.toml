schema = 2

[generator]
repository = "tailrocks/termrock"
revision = "eed474c4a1d9b071fd1b5de00c769c8997398e5a"

# Public repo: GitHub-hosted singleton (no velnor lanes).
[workflow]
providers = ["github-hosted"]
automatic_providers = ["github-hosted"]
default_branch = "main"

[workflow.selectors.github-hosted]
runs_on = ["ubuntu-24.04"]

[policy]
ruleset_required_status_checks = ["ci-required", "Policy"]
ruleset_external_status_checks = ["DCO"]

# docs `bun run build` shells to wasm-pack (build:preview-runtime);
# provision it from the repo mise lock (binstall-backed, no compile).
# cargo-binstall + rust ride along: the cargo backend refuses to install
# without its configured binstall dependency and rust toolchain present.
[[units]]
id = "bun-termrock-docs"
mise_tools = ["cargo-binstall", "rust", "cargo:wasm-pack"]
