runner = "ubuntu-26.04"
hosted = true
# Cold: the Target and Sources caches are not saved while Cargo.lock holds git
# sources (docs/ci.md), so the build job compiles the workspace twice from scratch.
timeout_minutes = 45

# The old `functional` suite ran four hash partitions (profile `functional`,
# eight test threads, 15 minutes each). velnor-gen has no partitions, so the
# functional binaries are split into two disjoint groups of about 700 tests;
# `velnor-ci test-groups check` fails the build job when two groups select the
# same test. A functional test that no group names runs in `rust-test-default-root`.
# Each group builds the workspace once, cold (no cache restore for a group job),
# so two groups rather than four keep the cache report's repeated compilations
# of the same units at two (see docs/ci.md, Cache).
[[test_groups]]
name = "functional-cases-ab"
filter = "binary_id(=termrock-functional::functional) and (test(/^cases::g05_/) or test(/^cases::h0/) or test(/^cases::s0[1-7]_/))"
root = "."
needs = ["cargo"]
test_threads = 8
timeout_minutes = 30

[[test_groups]]
name = "functional-cases-c-apps"
filter = "(binary_id(=termrock-functional::functional) and (test(/^cases::s0[89]_/) or test(/^cases::s10_/) or test(/^cases::t0/) or test(/^cases::x0/) or not test(/^cases::/))) or binary_id(=functional-cross::functional) or binary_id(=jackin-console::functional)"
root = "."
needs = ["cargo"]
test_threads = 8
timeout_minutes = 30

# The default test job installs only cargo-nextest and no Rust, so a test that
# runs `cargo metadata` cannot pass there. These three read the workspace graph
# with cargo; a group that needs `cargo` installs the toolchain and mbx, and the
# default job leaves its tests out.
[[test_groups]]
name = "cargo-tools"
filter = "(binary_id(=jackin-console::product_manifest) and test(=manifest_shape)) or (binary_id(=termrock::regressions) and (test(=layering::layering_crates_follow_the_table) or test(=layering::layering_stage_b_runs_on_the_extracted_crates)))"
root = "."
needs = ["cargo"]
test_threads = 4
timeout_minutes = 30

[[test_lane]]
root = "."
features = ["cli", "demo", "product", "terminal", "test-support", "work-metrics"]
# The functional journeys run in the test groups above, as they did before
# (the old `ci` profile filtered `binary(functional)` out of the per-crate jobs).
# `velnor-ci lane-guard` fails the job if a test that exists only with these
# features falls outside this filter; none does today.
packages = ["functional-cross", "jackin-console", "junie-tui", "termrock", "termrock-catalog", "termrock-cli", "termrock-collections", "termrock-conformance", "termrock-controls", "termrock-core", "termrock-dialogs", "termrock-editors", "termrock-feedback", "termrock-fields", "termrock-functional", "termrock-grid", "termrock-holla", "termrock-layout", "termrock-metrics", "termrock-navigation", "termrock-overlays", "termrock-runtime", "termrock-session", "termrock-shell", "termrock-showcase", "termrock-tablepro", "termrock-terminal", "termrock-text", "termrock-theme", "termrock-viewport"]
filter = "not binary(functional)"
lint = true
doc = true

[[lint]]
kind = "jactionlint"
config = ".github/jactionlint.yaml"

[[lint]]
kind = "mise-task"
id = "generated-workflows"
name = "Generated workflows"
task = "check-generated-workflows"
tools = ["github:tailrocks/velnor-new", "rust", "mr-boxington"]
timeout_minutes = 10

# velnor-gen's `Check <crate> alone` steps are default-feature `cargo check`
# runs without `-D warnings`. This job builds every workspace member alone,
# with default and with all features, under clippy `-D warnings` (mise task
# `check-crates-alone`), which is what the 27 per-crate jobs did.
[[lint]]
kind = "mise-task"
id = "crates-alone"
name = "Crates alone"
task = "check-crates-alone"
tools = ["rust", "mr-boxington"]
timeout_minutes = 45
