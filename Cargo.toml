[package]
name = "junie-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Junie-inspired Ratatui design-system laboratory"
license = "MIT"

[workspace]
members = [
    ".",
    "apps/holla",
    "apps/jackin",
    "apps/showcase",
    "apps/tablepro",
    "crates/termrock",
    "crates/termrock-controls",
    "crates/termrock-core",
    "crates/termrock-metrics",
    "crates/termrock-runtime",
    "crates/termrock-session",
    "crates/termrock-text",
    "crates/termrock-theme",
    "crates/functional-cross",
]
default-members = [
    ".",
    "apps/holla",
    "apps/jackin",
    "apps/showcase",
    "apps/tablepro",
    "crates/termrock",
    "crates/termrock-controls",
    "crates/termrock-core",
    "crates/termrock-metrics",
    "crates/termrock-runtime",
    "crates/termrock-session",
    "crates/termrock-text",
    "crates/termrock-theme",
    "crates/functional-cross",
]

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
ratatui = { version = "0.30", features = ["crossterm_0_29"] }
serde_json = "1"
sha2 = "0.10.9"
termrock-controls = { path = "crates/termrock-controls", version = "0.1.0" }
termrock-core = { path = "crates/termrock-core", version = "0.1.0" }
termrock-metrics = { path = "crates/termrock-metrics", version = "0.1.0" }
termrock-runtime = { path = "crates/termrock-runtime", version = "0.1.0" }
termrock-session = { path = "crates/termrock-session", version = "0.1.0" }
termrock-text = { path = "crates/termrock-text", version = "0.1.0" }
termrock-theme = { path = "crates/termrock-theme", version = "0.1.0" }
tui-test = { package = "tuiscotti-tui-test", version = "=0.2.1" }
tuiscotti-latest = { package = "tuiscotti", git = "https://github.com/tailrocks/tuiscotti", rev = "f1fb3f276b8d49948881c07b3bbc619840b6cc93" }

[features]
default = ["cli", "terminal"]
cli = ["dep:clap", "termrock-core/cli"]
terminal = ["dep:termpane"]
product = ["terminal"]
work-metrics = ["termrock-controls/work-metrics", "termrock-core/work-metrics", "termrock-metrics/work-metrics", "termrock-runtime/work-metrics", "termrock-session/work-metrics"]

[lib]
name = "junie_tui"
path = "src/lib.rs"

doctest = false

[[test]]
name = "functional"
path = "tests/functional/main.rs"
required-features = ["cli", "terminal"]

[dependencies]
clap = { workspace = true, optional = true }
termpane = { git = "https://github.com/tailrocks/termpane", rev = "d05d114bdce504d184b00836376a350851806f61", optional = true, default-features = false }
ratatui = { workspace = true }
unicode-width = "0.2.3"
unicode-segmentation = "1"
serde_json = { workspace = true }
termrock-controls = { workspace = true }
termrock-core = { workspace = true }
termrock-metrics = { workspace = true }
termrock-runtime = { workspace = true }
termrock-session = { workspace = true }
termrock-text = { workspace = true }
termrock-theme = { workspace = true }

[target.'cfg(unix)'.dependencies]

libc = "0.2"

[dev-dependencies]
syn = { version = "=3.0.10", features = ["full", "visit"] }
toml = "=1.2.1"

tui-test = { workspace = true }
termrock-text = { workspace = true, features = ["test-support"] }

tuiscotti-latest = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
