[package]
name = "junie-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Junie-inspired Ratatui design-system laboratory"
license = "MIT"

[workspace]
members = [
    ".",
    "apps/holla",
    "apps/jackin",
    "apps/showcase",
    "apps/tablepro",
    "crates/termrock",
    "crates/termrock-catalog",
    "crates/termrock-cli",
    "crates/termrock-collections",
    "crates/termrock-conformance",
    "crates/termrock-controls",
    "crates/termrock-core",
    "crates/termrock-dialogs",
    "crates/termrock-editors",
    "crates/termrock-feedback",
    "crates/termrock-fields",
    "crates/termrock-grid",
    "crates/termrock-layout",
    "crates/termrock-metrics",
    "crates/termrock-navigation",
    "crates/termrock-overlays",
    "crates/termrock-runtime",
    "crates/termrock-session",
    "crates/termrock-shell",
    "crates/termrock-terminal",
    "crates/termrock-text",
    "crates/termrock-theme",
    "crates/termrock-viewport",
    "crates/functional-cross",
    "crates/termrock-functional",
]
default-members = [
    ".",
    "apps/holla",
    "apps/jackin",
    "apps/showcase",
    "apps/tablepro",
    "crates/termrock",
    "crates/termrock-catalog",
    "crates/termrock-cli",
    "crates/termrock-collections",
    "crates/termrock-conformance",
    "crates/termrock-controls",
    "crates/termrock-core",
    "crates/termrock-dialogs",
    "crates/termrock-editors",
    "crates/termrock-feedback",
    "crates/termrock-fields",
    "crates/termrock-grid",
    "crates/termrock-layout",
    "crates/termrock-metrics",
    "crates/termrock-navigation",
    "crates/termrock-overlays",
    "crates/termrock-runtime",
    "crates/termrock-session",
    "crates/termrock-shell",
    "crates/termrock-terminal",
    "crates/termrock-text",
    "crates/termrock-theme",
    "crates/termrock-viewport",
    "crates/functional-cross",
    "crates/termrock-functional",
]

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
ratatui = { version = "0.30", features = ["crossterm_0_29"] }
serde_json = "1"
sha2 = "0.11.0"
termrock = { path = "crates/termrock", version = "0.1.0" }
termrock-catalog = { path = "crates/termrock-catalog", version = "0.1.0" }
termrock-cli = { path = "crates/termrock-cli", version = "0.1.0" }
termrock-collections = { path = "crates/termrock-collections", version = "0.1.0" }
termrock-conformance = { path = "crates/termrock-conformance", version = "0.1.0" }
termrock-controls = { path = "crates/termrock-controls", version = "0.1.0" }
termrock-core = { path = "crates/termrock-core", version = "0.1.0" }
termrock-dialogs = { path = "crates/termrock-dialogs", version = "0.1.0" }
termrock-editors = { path = "crates/termrock-editors", version = "0.1.0" }
termrock-feedback = { path = "crates/termrock-feedback", version = "0.1.0" }
termrock-fields = { path = "crates/termrock-fields", version = "0.1.0" }
termrock-grid = { path = "crates/termrock-grid", version = "0.1.0" }
termrock-layout = { path = "crates/termrock-layout", version = "0.1.0" }
termrock-metrics = { path = "crates/termrock-metrics", version = "0.1.0" }
termrock-navigation = { path = "crates/termrock-navigation", version = "0.1.0" }
termrock-overlays = { path = "crates/termrock-overlays", version = "0.1.0" }
termrock-runtime = { path = "crates/termrock-runtime", version = "0.1.0" }
termrock-session = { path = "crates/termrock-session", version = "0.1.0" }
termrock-shell = { path = "crates/termrock-shell", version = "0.1.0" }
termrock-terminal = { path = "crates/termrock-terminal", version = "0.1.0" }
termrock-text = { path = "crates/termrock-text", version = "0.1.0" }
termrock-theme = { path = "crates/termrock-theme", version = "0.1.0" }
termrock-viewport = { path = "crates/termrock-viewport", version = "0.1.0" }
tui-test = { package = "tuiscotti-tui-test", version = "=0.2.1" }
tuiscotti-latest = { package = "tuiscotti", git = "https://github.com/tailrocks/tuiscotti", rev = "f1fb3f276b8d49948881c07b3bbc619840b6cc93" }

[features]
default = ["cli", "terminal"]
cli = ["termrock/cli"]
terminal = ["termrock/terminal"]
product = ["termrock/product"]
work-metrics = ["termrock/work-metrics"]

[lib]
name = "junie_tui"
path = "src/lib.rs"
doctest = false

[dependencies]
termrock = { workspace = true }

[dev-dependencies]
ratatui = { workspace = true }
# tests/terminal_guard.rs builds a `termpane::DamageGrid` directly.
termpane = { git = "https://github.com/tailrocks/termpane", rev = "d05d114bdce504d184b00836376a350851806f61", default-features = false }
syn = { version = "=3.0.10", features = ["full", "visit"] }
toml = "=1.2.1"

tui-test = { workspace = true }
termrock-text = { workspace = true, features = ["test-support"] }

tuiscotti-latest = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
