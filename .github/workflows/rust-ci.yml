        if: '${{ !cancelled() && steps.restored.outcome == ''success'' }}'
        run: '. "$VELNOR_EXEC" run -- velnor-ci inputs build -- cargo-nextest nextest archive --workspace --locked --cargo-message-format=json-render-diagnostics --archive-file ''nextest-archive.tar.zst'''
      # jactionlint ignore=shellcheck
      - name: velnor-ci test-groups check
        run: '. "$VELNOR_EXEC" test-groups check --group ''functional-cases-a=binary_id(=termrock-functional::functional) and (test(/^cases::g05_/) or test(/^cases::h0/) or test(/^cases::s01_/) or test(/^cases::s02_/) or test(/^cases::s03_/))'' --group ''functional-cases-b=binary_id(=termrock-functional::functional) and (test(/^cases::s04_/) or test(/^cases::s05_/) or test(/^cases::s06_/) or test(/^cases::s07_/))'' --group ''functional-cases-c=(binary_id(=termrock-functional::functional) and (test(/^cases::s08_/) or test(/^cases::s09_/) or test(/^cases::s10_/) or test(/^cases::t0/) or test(/^cases::x0/))) or binary_id(=functional-cross::functional)'' --group ''functional-apps=(binary_id(=termrock-functional::functional) and not test(/^cases::/)) or binary_id(=jackin-console::functional)'' --group ''cargo-tools=(binary_id(=jackin-console::product_manifest) and test(=manifest_shape)) or (binary_id(=termrock::regressions) and (test(=layering::layering_crates_follow_the_table) or test(=layering::layering_stage_b_runs_on_the_extracted_crates)))'''
      - name: Upload the tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nextest-archive-root
          path: nextest-archive.tar.zst
          compression-level: 0
          retention-days: 7
