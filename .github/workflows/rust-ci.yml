  rust-test-root:
    needs:
      - rust-plan
    if: '${{ (github.event_name != ''pull_request'' || (startsWith(github.ref, ''refs/pull/'') && github.event.pull_request.state != ''closed'')) && (needs.rust-plan.result == ''success'' && needs.rust-plan.outputs.rust_root_mode != ''none'') }}'
    permissions:
      contents: read
    cache-mode: write
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: '${{ github.workspace }}/target'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve released helper tools
        env:
          VELNOR_HELPER_INSTALL_TOOLS: *velnor_0
        run: 'eval "$VELNOR_HELPER_INSTALL_TOOLS"'
      - name: Install velnor-ci 0.1.109
        uses: tailrocks/velnor-new/actions/setup-velnor@4559e79b32d6d5ddb3f81e589ea61efbb090d1a1  # tools-v0.1.109
        with:
          version: '0.1.109'
          sha256-linux-x64: '5dc77ea0cbfebe510858103c3fef4e1a6aed7668b2c177f5853ddff3b6334752'
          sha256-linux-arm64: '8acff5141c40cff7d98d4709e641c9cf4a04f7d73aed6ddd60f081e6a3c3415b'
      - name: Install the released helper launcher
        env:
          VELNOR_HELPER_INSTALL_LAUNCHER: *velnor_1
          VELNOR_HELPER_LAUNCHER: *velnor_2
          VELNOR_HELPER_SHA256: *velnor_3
        run: 'eval "$VELNOR_HELPER_INSTALL_LAUNCHER"'
      - name: Private mbx store
        run: 'echo "MBX_CACHE_DIR=$RUNNER_TEMP/mbx" >> "$GITHUB_ENV"'
      - id: tools
        name: Restore the tools cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.local/share/mise
            ~/.rustup
          key: *velnor_4
      # jactionlint ignore=shellcheck
      - name: Clear anchor
        run: '. "$VELNOR_EXEC" tools-verify reset'
      - id: toolsanchor
        name: Restore anchor
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: *velnor_5
          key: *velnor_6
      # jactionlint ignore=shellcheck
      - id: toolsverify
        name: Verify tools
        env:
          VELNOR_ANCHOR_HIT: *velnor_7
        run: '. "$VELNOR_EXEC" tools-verify check'
      - name: Install tools
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d
        with:
          version: '2026.11.10'
          cache: false
      - name: Add Rust components
        run: rustup component add clippy rustfmt
      - name: Add Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu
      # jactionlint ignore=shellcheck
      - id: toolsrecord
        name: Record anchor
        env:
          VELNOR_ANCHOR_HIT: *velnor_7
        run: '. "$VELNOR_EXEC" tools-verify record'
      - name: Save anchor
        if: *velnor_8
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: *velnor_5
          key: *velnor_6
      - id: save_tools
        name: Save the tools cache
        if: *velnor_9
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.local/share/mise
            ~/.rustup
          key: *velnor_4
      # jactionlint ignore=shellcheck
      - id: prepare
        name: velnor-ci prepare
        run: '. "$VELNOR_EXEC" prepare --lock-root root'
      # jactionlint ignore=shellcheck
      - name: velnor-ci check-metadata
        run: '. "$VELNOR_EXEC" check-metadata'
      - id: sources_locks
        name: Hash the sources lockfiles
        env:
          SOURCES_LOCKS: *velnor_10
        run: 'echo "hash=$SOURCES_LOCKS" >> "$GITHUB_OUTPUT"'
      - id: sources_root
        name: Restore the sources cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: 'velnor-src-${{ runner.os }}-${{ runner.arch }}-all.roots-${{ steps.sources_locks.outputs.hash }}'
          restore-keys: 'velnor-src-${{ runner.os }}-${{ runner.arch }}-all.roots-'
      - id: target_root
        name: Restore the target cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          key: 'velnor-tgt-rust-test-root.root.${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.compat }}-${{ steps.prepare.outputs.lock_root }}-${{ github.sha }}-${{ github.run_id }}'
          restore-keys: |
            velnor-tgt-rust-test-root.root.${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.compat }}-${{ steps.prepare.outputs.lock_root }}-
