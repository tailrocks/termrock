      # jactionlint ignore=shellcheck
      - id: restored
        name: velnor-ci restored
        run: '. "$VELNOR_EXEC" restored --target-dir "${GITHUB_WORKSPACE}"/target --target-dir "${GITHUB_WORKSPACE}"/target/velnor-roots/crates_termrock_tests_consumers_jackin_host --target-dir "${GITHUB_WORKSPACE}"/target/velnor-roots/crates_termrock_tests_consumers_keyed_modal --target-dir "${GITHUB_WORKSPACE}"/target/velnor-roots/crates_termrock_tests_consumers_minimal --target-dir "${GITHUB_WORKSPACE}"/target/velnor-roots/crates_termrock_tests_consumers_terminal'
      # jactionlint ignore=shellcheck
