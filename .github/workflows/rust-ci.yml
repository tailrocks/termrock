    if: '${{ (github.event_name != ''pull_request'' || (startsWith(github.ref, ''refs/pull/'') && github.event.pull_request.state != ''closed'')) && (needs.rust-plan.result == ''success'' && needs.rust-plan.outputs.rust_root_mode != ''none'') }}'
    permissions:
      actions: read
      contents: read
    cache-mode: write
    outputs:
      base_prefix: 'velnor-tgt-rust-test-root.root.${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.compat }}-'
      base_save: '${{ steps.base.outputs.save }}'
      target_key: '${{ steps.target_key.outputs.key }}'
