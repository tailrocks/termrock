  build:
    name: Build / ${{ matrix.target }}
    needs: [verify, release-github-bun-termrock-docs, release-github-rust-oldrev-harness, release-github-rust-policy, release-github-rust-termrock, release-github-rust-termrock-catalog, release-github-rust-termrock-catalog-web, release-github-rust-termrock-cli, release-github-rust-termrock-contract-audit, release-github-rust-termrock-raster, release-velnor-bun-termrock-docs, release-velnor-rust-oldrev-harness, release-velnor-rust-policy, release-velnor-rust-termrock, release-velnor-rust-termrock-catalog, release-velnor-rust-termrock-catalog-web, release-velnor-rust-termrock-cli, release-velnor-rust-termrock-contract-audit, release-velnor-rust-termrock-raster]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            lane: github
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            lane: github
            runner: ubuntu-24.04
    runs-on: ubuntu-24.04
    if: ${{ (github.event_name == 'push' && (github.ref_type == 'tag' || github.ref == 'refs/heads/main')) || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Velnor workflow runtime
        if: ${{ runner.environment == 'github-hosted' }}
        uses: tailrocks/velnor/.github/actions/setup-velnor-workflow@03f9409b3f649a8973169dde0ebba3fe58a92ac9
        with:
          rev: 03f9409b3f649a8973169dde0ebba3fe58a92ac9
      - name: Set trusted workflow policy revision
        run: echo "VELNOR_WORKFLOW_POLICY_REVISION=03f9409b3f649a8973169dde0ebba3fe58a92ac9" >> "$GITHUB_ENV"
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Add Rust target
        run: rustup target add "${{ matrix.target }}"
      - name: Build release binary
        env:
          CARGO_INCREMENTAL: "0"
          RUSTC_WRAPPER: sccache
        run: mbx build --locked --release --package termrock --bin termrock --target "${{ matrix.target }}"
      - name: Package release binary
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          velnor-workflow release package-binary --target "${{ matrix.target }}" --version "${VERSION#v}" --package termrock --binary termrock
      - name: Attest release artifact
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.lane }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Control / Publish
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: github-release
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: github-*
          merge-multiple: true
      - name: Verify artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for artifact in dist/*.tar.gz; do gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"; done
      - name: Verify archive checksums
        run: |
          set -euo pipefail
          cd dist
          for checksum in *.sha256; do sha256sum --check "$checksum"; done
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --verify-tag --generate-notes

# Release tags are cut from the protected main branch.
