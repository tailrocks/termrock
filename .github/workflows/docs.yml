name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      lanes:
        description: velnor (default) | github | both
        type: choice
        default: velnor
        options: [velnor, github, both]
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

env:
  DOCS_SITE_URL: https://termrock.tailrocks.com

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    if: github.event_name != 'schedule'
    name: Docs (${{ matrix.config.lane }})
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.lanes == 'both') && '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true},{"lane":"GitHub","runner":"ubuntu-26.04","writer":false}]' || (github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') && '[{"lane":"GitHub","runner":"ubuntu-26.04","writer":true}]' || (github.event_name == 'push' || github.event_name == 'pull_request') && '[{"lane":"GitHub","runner":"ubuntu-26.04","writer":true}]' || '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true}]') }}
    runs-on: ${{ matrix.config.runner }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "false"
      SCCACHE_CACHE_SIZE: 20G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
      - id: sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: v0.16.0
          disable_annotations: "false"
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: cargo-registry-${{ matrix.config.lane }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'docs/bun.lock') }}
          restore-keys: |
            cargo-registry-${{ matrix.config.lane }}-${{ runner.os }}-
      - name: Cache Cargo target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: cargo-target-${{ matrix.config.lane }}-${{ runner.os }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', '**/Cargo.toml', '**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: cargo-target-${{ matrix.config.lane }}-${{ runner.os }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', '**/Cargo.toml', '**/Cargo.lock') }}-
      - run: rustup toolchain install nightly --profile minimal
      - run: rustup target add wasm32-unknown-unknown
      - working-directory: docs
        run: bun install --frozen-lockfile
      - working-directory: docs
        # The native mold linker flag is invalid for wasm32's rust-lld.
        env:
          RUSTFLAGS: ""
        run: bun run types:check
      - working-directory: docs
        env:
          RUSTFLAGS: ""
        run: bun run build
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('docs/bun.lock') }}
      - name: Install browser test runtime
        working-directory: docs
        run: bunx playwright install --with-deps chromium
      - name: Verify live component and pattern behavior
        working-directory: docs
        run: bun run test:browser
      # Docs use the live Rust/WASM runtime. One frame per demo is retained only
      # as a fallback for browsers where WebAssembly cannot initialize.
      - name: Assert live-preview asset shape
        run: |
          if [ -d docs/public/component-previews ]; then
            echo 'docs/public/component-previews must not ship; use TerminalPreview' >&2
            exit 1
          fi
          if [ -d docs/public/preview-frames ]; then
            echo 'multi-step preview frame packs are forbidden' >&2
            exit 1
          fi
          test -f docs/public/preview-posters/list-selection.json
      - run: rm -rf target/render-a target/render-b
      - run: cargo run -p termrock-catalog -- render --out target/render-a >/dev/null
      - run: cargo run -p termrock-catalog -- render --out target/render-b >/dev/null
      - run: diff -r target/render-a target/render-b
      - run: cargo run -p termrock-catalog -- render --out target/render-slate >/dev/null
      - name: Configure GitHub Pages
        if: matrix.config.writer && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload GitHub Pages artifact
        if: matrix.config.writer && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist/client
  deploy-pages:
    name: Deploy Pages (${{ matrix.config.lane }})
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: docs
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.lanes == 'both') && '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true},{"lane":"GitHub","runner":"ubuntu-26.04","writer":false}]' || (github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') && '[{"lane":"GitHub","runner":"ubuntu-26.04","writer":true}]' || (github.event_name == 'push' || github.event_name == 'pull_request') && '[{"lane":"GitHub","runner":"ubuntu-26.04","writer":true}]' || '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true}]') }}
    runs-on: ${{ matrix.config.runner }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        if: matrix.config.writer
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  verify-deployed:
    name: Verify deployed documentation
    if: >-
      always() &&
      (github.event_name == 'schedule' ||
       (github.ref == 'refs/heads/main' &&
        github.event_name == 'push' &&
        needs.deploy-pages.result == 'success'))
    needs: deploy-pages
    runs-on: ${{ ((github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') || github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'schedule') && 'ubuntu-26.04' || fromJSON('["self-hosted","velnor-target-mvp"]') }}
    timeout-minutes: 10
    steps:
      - name: Verify custom-domain site
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            html=$(curl --compressed --fail --silent --show-error --location "${DOCS_SITE_URL}/" | tr -d '\000') || true
            docs_html=$(curl --compressed --fail --silent --show-error --location "${DOCS_SITE_URL}/docs" | tr -d '\000') || true
            if grep -q 'TermRock</title>' <<< "$html" &&
               grep -q 'href="/assets/' <<< "$html" &&
               grep -q '>TermRock</h1>' <<< "$docs_html" &&
               ! grep -q '/termrock/' <<< "$html"; then
              exit 0
            fi
            echo "Custom-domain documentation not ready (attempt ${attempt}/20)"
            sleep 15
          done
          echo "Custom-domain documentation failed content verification: ${DOCS_SITE_URL}/" >&2
          exit 1
