# Temporary bootstrap workflow: seeds the velnor cargo-sources cache so the
# generated 0.1.9 CI Plan job (whose offline metadata resolves against
# $RUNNER_TEMP/velnor/cargo) can pass on this repo, which has no pre-existing
# sources cache. Remove once the cache exists.
name: Seed Cargo Sources
"on":
  push: {}
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
env:
  MISE_AUTO_INSTALL: "false"
  MISE_EXEC_AUTO_INSTALL: "false"
  MISE_LOCKFILE: "0"
  MISE_NO_CONFIG: "1"
  MISE_NO_ENV: "1"
  MISE_NO_HOOKS: "1"
  MISE_QUIET: "1"
  MISE_YES: "1"
  VELNOR_ASSET_URL: https://github.com/tailrocks/velnor-new/releases/download/v0.1.9/velnor-actions-0.1.9-x86_64-unknown-linux-gnu
  VELNOR_ASSET_SHA256: 6cd0fb8b096d49f1d02b713428da04fabbe836dd3b7113d483ffbe59db96fa8e
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: "0"
          persist-credentials: "false"
      - name: Setup Mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
        with:
          cache: "false"
          cache_save: "false"
          env: "false"
          install: "false"
          sha256: c72477ae6c3a8e7d817a322f43da70e4643e75ee5c21265f1c19c894273b7428
          version: 2026.10.8
      - name: Prepare pinned tools
        env:
          MISE_CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          MISE_RUSTUP_HOME: ${{ runner.temp }}/velnor/rustup
        run: mise --no-config --no-env --no-hooks install rust@1.97.1
      - name: Fetch Cargo sources
        env:
          MISE_CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          MISE_RUSTUP_HOME: ${{ runner.temp }}/velnor/rustup
          CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          RUSTUP_HOME: ${{ runner.temp }}/velnor/rustup
        run: |
          mise --no-config --no-env --no-hooks exec rust@1.97.1 -- cargo fetch --locked --manifest-path "$GITHUB_WORKSPACE/Cargo.toml"
          mise --no-config --no-env --no-hooks exec rust@1.97.1 -- cargo fetch --locked --manifest-path "$GITHUB_WORKSPACE/docs/contract-audit/Cargo.toml"
          mise --no-config --no-env --no-hooks exec rust@1.97.1 -- cargo fetch --locked --manifest-path "$GITHUB_WORKSPACE/tools/oldrev-harness/Cargo.toml"
      - name: Debug cargo home
        run: |
          du -sh "$RUNNER_TEMP/velnor/cargo" "$RUNNER_TEMP/velnor/cargo"/* 2>/dev/null || true
          ls "$RUNNER_TEMP/velnor/cargo/registry"
      - name: Verify generator passes with this cargo home
        env:
          MISE_CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          MISE_RUSTUP_HOME: ${{ runner.temp }}/velnor/rustup
        run: |
          mkdir -p "$RUNNER_TEMP/gen"
          velnor_bin="$RUNNER_TEMP/velnor/bin/velnor-actions-0.1.9"
          mkdir -p "${velnor_bin%/*}"
          curl -fsSL --retry 5 --retry-all-errors --proto '=https' --tlsv1.2 "$VELNOR_ASSET_URL" -o "$velnor_bin" \
            && echo "$VELNOR_ASSET_SHA256  $velnor_bin" | sha256sum -c -
          chmod +x "$velnor_bin"
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_RUNTIME_TOKEN GITHUB_TOKEN MISE_GITHUB_TOKEN GH_TOKEN GH_HOST GH_CONFIG_DIR
          "$velnor_bin" generate --output-dir "$RUNNER_TEMP/gen"
      - name: Save Cargo sources
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: velnor-v1-sources-x86_64-unknown-linux-gnu-1.97.1-seed2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/velnor/cargo/registry/index
            ${{ runner.temp }}/velnor/cargo/registry/cache
            ${{ runner.temp }}/velnor/cargo/git/db
