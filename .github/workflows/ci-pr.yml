    name: "Bun · Bun package (termrock-docs) · github-hosted — bun-termrock-docs"
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(needs.plan.outputs.units, '"unit_id":"bun-termrock-docs"') && (true) }}
