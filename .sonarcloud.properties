# SonarCloud Automatic Analysis settings.
#
# src/catalog.rs and apps/showcase/src/coverage.rs are declarative registries: one
# line per public API (an id, a kind, a route, a scenario). The declared-API gate
# (#14) reads them as data, and their lines are alike by design. SonarCloud's
# copy-paste detector reads each run of alike lines as duplicated code, which
# failed the new-code duplication condition at 15% on a PR whose only new code
# was these tables and their tests. Leave them out of duplication detection;
# every other rule still applies to them.
#
# apps/showcase/src/coverage/lane_*.rs are the same tables, split per lane of the
# #14 burn-down (each holds only a PROOFS and an EXCEPTIONS array). A lane that
# proves 300 APIs adds 300 alike lines there, which read as 9% duplication on a PR
# whose scenario code is not duplicated. The scenario files
# (apps/showcase/src/app_tests_catalog/*.rs) stay in duplication detection.
#
# The catalog moves to the `termrock-catalog` crate in the crate split (#439, #449).
# Both locations are listed so the exclusion holds before, during and after that
# move: a renamed file counts as new code, and 5.4k alike lines would fail the gate.
sonar.cpd.exclusions=src/catalog.rs,crates/termrock-catalog/src/catalog.rs,apps/showcase/src/coverage.rs,apps/showcase/src/coverage/lane_*.rs
