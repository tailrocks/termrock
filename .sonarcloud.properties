# SonarCloud Automatic Analysis settings.
#
# src/catalog.rs and apps/showcase/src/coverage.rs are declarative registries: one
# line per public API (an id, a kind, a route, a scenario). The declared-API gate
# (#14) reads them as data, and their lines are alike by design. SonarCloud's
# copy-paste detector reads each run of alike lines as duplicated code, which
# failed the new-code duplication condition at 15% on a PR whose only new code
# was these tables and their tests. Leave them out of duplication detection;
# every other rule still applies to them.
#
# apps/showcase/src/coverage/lane_*.rs are the same tables, split per lane of the
# #14 burn-down (each holds only a PROOFS and an EXCEPTIONS array). A lane that
# proves 300 APIs adds 300 alike lines there, which read as 9% duplication on a PR
# whose scenario code is not duplicated. The scenario files
# (apps/showcase/src/app_tests_catalog/*.rs) stay in duplication detection.
#
# The functional journey cases (tests/functional/cases, then
# crates/termrock-functional/tests/functional/cases, and the cross-binary cases)
# are one script per screen. They share a frame-check scaffold (`check_frame`,
# `baseline_hit`) that each file repeats, so a one-line edit of every copy reads
# as duplicated code: #451's first PR changed one line in each of 35 case files
# (the baseline lookup) and SonarCloud reported 32.5% new-code duplication on 77
# new lines. The shared harness (support.rs, bins.rs) stays in duplication
# detection; every other rule still applies to the cases.
sonar.cpd.exclusions=src/catalog.rs,apps/showcase/src/coverage.rs,apps/showcase/src/coverage/lane_*.rs,tests/functional/cases/**,crates/termrock-functional/tests/functional/cases/**,crates/functional-cross/tests/functional/cases/**

# Test code. Automatic Analysis classifies files under a `tests/` directory as
# test code, so the CI policy scripts, their fixtures and their mutants were not
# held to the vulnerability rules while they lived in tests/ (#450). They moved to
# scripts/policy/ and read as main code there, which failed the Security Rating on
# New Code at E on rules about path traversal and argument injection for harnesses
# that only build and inspect sandbox repositories. Keep them classified as test
# code, and keep the same classification for every `tests/` directory.
sonar.test.inclusions=scripts/policy/**,tests/**,**/tests/**
