# SonarCloud Automatic Analysis settings. Temporary: removed by the declared-API
# gate PR (#182) that follows this change.
#
# The sidebar refresh moves 1,736 captures and edits 38 functional case files in
# one PR. SonarCloud's analysis of such a PR ends as "analysis failed" instead of a
# quality gate verdict. Probes on throwaway branches (1,736 captures plus
# 0, 3 or 60 other files) passed, and 1,736 captures plus 19 or more case files
# failed every time; with the case files listed below excluded, the same diff
# passed. The case files are route and keystroke tables that tuiscotti runs.
sonar.exclusions=tests/functional/cases/**,crates/*/tests/functional/cases/**
