[package]
name = "termrock-showcase"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The TermRock flagship workbench — a real-work TUI built on public APIs only"
readme = "README.md"
publish = false

[lib]
name = "termrock_showcase"
path = "src/lib.rs"

[[bin]]
name = "termrock-showcase"
path = "src/main.rs"

[dependencies]
termrock = { path = "../termrock", version = "0.11.0", features = ["crossterm"] }
ratatui-core.workspace = true

[lints]
workspace = true
