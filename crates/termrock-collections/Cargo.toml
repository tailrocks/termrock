[package]
name = "termrock-collections"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Lists, trees, property sheets, list-detail and search-detail for the Termrock terminal UI library"
license = "MIT"

[lib]
doctest = false

[features]
default = []
work-metrics = ["termrock-controls/work-metrics", "termrock-core/work-metrics", "termrock-feedback/work-metrics", "termrock-fields/work-metrics", "termrock-metrics/work-metrics", "termrock-overlays/work-metrics", "termrock-runtime/work-metrics", "termrock-viewport/work-metrics"]

[dependencies]
ratatui = { workspace = true }
termrock-controls = { workspace = true }
termrock-core = { workspace = true }
termrock-feedback = { workspace = true }
termrock-fields = { workspace = true }
termrock-layout = { workspace = true }
termrock-metrics = { workspace = true }
termrock-overlays = { workspace = true }
termrock-runtime = { workspace = true }
termrock-text = { workspace = true }
termrock-theme = { workspace = true }
termrock-viewport = { workspace = true }
