[package]
name = "termrock-editors"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Code editor, text area and diff view for the Termrock terminal UI library"
license = "MIT"

[lib]
doctest = false

[features]
default = []
work-metrics = ["termrock-controls/work-metrics", "termrock-core/work-metrics", "termrock-fields/work-metrics", "termrock-metrics/work-metrics", "termrock-overlays/work-metrics", "termrock-runtime/work-metrics", "termrock-viewport/work-metrics"]

[dependencies]
ratatui = { workspace = true }
termrock-controls = { workspace = true }
termrock-core = { workspace = true }
termrock-fields = { workspace = true }
termrock-metrics = { workspace = true }
termrock-overlays = { workspace = true }
termrock-runtime = { workspace = true }
termrock-text = { workspace = true }
termrock-theme = { workspace = true }
termrock-viewport = { workspace = true }
unicode-segmentation = "1"

[dev-dependencies]
termrock-text = { workspace = true, features = ["test-support"] }
