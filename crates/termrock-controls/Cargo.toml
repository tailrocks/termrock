[package]
name = "termrock-controls"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Key hints, hint bar, buttons, choices, scroll bar and brand marks for the Termrock terminal UI library"
license = "MIT"

[lib]
doctest = false

[features]
default = []
work-metrics = ["termrock-metrics/work-metrics"]

[dependencies]
ratatui = { workspace = true }
termrock-core = { workspace = true }
termrock-metrics = { workspace = true }
termrock-runtime = { workspace = true }
termrock-text = { workspace = true }
termrock-theme = { workspace = true }
unicode-segmentation = "1"
