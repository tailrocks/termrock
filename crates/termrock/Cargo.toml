[package]
name = "termrock"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Supported import path for the Termrock terminal UI library"
license = "MIT"

[lib]
doctest = false

[features]
default = []
cli = ["dep:termrock-cli", "termrock-core/cli"]
terminal = ["dep:termrock-terminal"]
product = ["terminal"]
work-metrics = ["dep:termrock-conformance", "termrock-catalog/work-metrics", "termrock-collections/work-metrics", "termrock-conformance/work-metrics", "termrock-controls/work-metrics", "termrock-core/work-metrics", "termrock-editors/work-metrics", "termrock-feedback/work-metrics", "termrock-fields/work-metrics", "termrock-grid/work-metrics", "termrock-metrics/work-metrics", "termrock-navigation/work-metrics", "termrock-overlays/work-metrics", "termrock-runtime/work-metrics", "termrock-session/work-metrics", "termrock-shell/work-metrics", "termrock-terminal?/work-metrics", "termrock-viewport/work-metrics"]

[dependencies]
termrock-catalog = { workspace = true }
termrock-cli = { workspace = true, optional = true }
termrock-collections = { workspace = true }
termrock-conformance = { workspace = true, optional = true }
termrock-controls = { workspace = true }
termrock-core = { workspace = true }
termrock-dialogs = { workspace = true }
termrock-editors = { workspace = true }
termrock-feedback = { workspace = true }
termrock-fields = { workspace = true }
termrock-grid = { workspace = true }
termrock-layout = { workspace = true }
termrock-metrics = { workspace = true }
termrock-navigation = { workspace = true }
termrock-overlays = { workspace = true }
termrock-runtime = { workspace = true }
termrock-session = { workspace = true }
termrock-shell = { workspace = true }
termrock-terminal = { workspace = true, optional = true }
termrock-text = { workspace = true }
termrock-theme = { workspace = true }
termrock-viewport = { workspace = true }

[dev-dependencies]
ratatui = { workspace = true }
serde_json = { workspace = true }
syn = { version = "=3.0.10", features = ["full", "visit"] }
toml = "=1.2.2"

# The six examples run headless: scripted events, a ratatui `TestBackend`, no
# terminal. `test = true` lets `cargo nextest run --examples` run the `#[test]`
# that each one carries. None needs the `cli` or `terminal` feature.
[[example]]
name = "validated_input"
test = true

[[example]]
name = "keyed_list"
test = true

[[example]]
name = "grid_effects"
test = true

[[example]]
name = "nested_scroll"
test = true

[[example]]
name = "modal_focus"
test = true

[[example]]
name = "bounded_messages"
test = true
