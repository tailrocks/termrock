[package]
name = "termrock"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Supported import path for the Termrock terminal UI library"
license = "MIT"

[lib]
doctest = false

[features]
default = []
cli = ["junie-tui/cli"]
terminal = ["junie-tui/terminal"]
product = ["terminal", "junie-tui/product"]
work-metrics = ["junie-tui/work-metrics"]

[dependencies]
junie-tui = { path = "../..", version = "0.1.0", default-features = false }

[dev-dependencies]
ratatui = { workspace = true }

# The six examples run headless: scripted events, a ratatui `TestBackend`, no
# terminal. `test = true` lets `cargo nextest run --examples` run the `#[test]`
# that each one carries. None needs the `cli` or `terminal` feature.
[[example]]
name = "validated_input"
test = true

[[example]]
name = "keyed_list"
test = true

[[example]]
name = "grid_effects"
test = true

[[example]]
name = "nested_scroll"
test = true

[[example]]
name = "modal_focus"
test = true

[[example]]
name = "bounded_messages"
test = true
