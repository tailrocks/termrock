[package]
name = "termrock-conformance"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Work-metrics harness, count-only reports and cross-crate regression tests for the Termrock terminal UI library"
license = "MIT"

[lib]
doctest = false

[features]
default = []
work-metrics = ["termrock-core/work-metrics", "termrock-metrics/work-metrics", "termrock-shell/work-metrics"]

[dependencies]
ratatui = { workspace = true }
termrock-core = { workspace = true }
termrock-metrics = { workspace = true }
termrock-shell = { workspace = true }
