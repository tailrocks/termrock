[package]
name = "termrock-session"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Terminal session, external channel, raw-input policy, panic bridge and clock for the Termrock terminal UI library"
license = "MIT"

[lib]
doctest = false

[features]
default = []
work-metrics = ["termrock-metrics/work-metrics"]

[dependencies]
ratatui = { workspace = true }
termrock-core = { workspace = true }
termrock-metrics = { workspace = true }
termrock-text = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
