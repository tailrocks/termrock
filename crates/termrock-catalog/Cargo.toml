#
# Adapted showcase shell, page composition, and TablePro application logic
# from junie-tui (MIT), https://github.com/donbeave/terminal-components-claude

[package]
name = "termrock-catalog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Canonical Junie-style TermRock catalog: Foundations, Components, Patterns, Screens, Applications"
publish = false
default-run = "termrock-catalog"

[lib]
name = "termrock_catalog"
path = "src/lib.rs"

[[bin]]
name = "termrock-catalog"
path = "src/main.rs"
required-features = ["native"]

[[bin]]
name = "tablepro"
path = "src/bin/tablepro.rs"
required-features = ["native"]

[features]
default = ["native"]
native = ["termrock/crossterm", "ratatui/crossterm", "dep:termrock-raster"]

[dependencies]
termrock = { version = "0.11.0", path = "../termrock" }
termrock-raster = { version = "0.11.0", path = "../termrock-raster", optional = true }
ratatui = { workspace = true, default-features = false, features = ["std", "all-widgets", "underline-color"] }
unicode-width.workspace = true
unicode-segmentation.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[lints]
workspace = true
