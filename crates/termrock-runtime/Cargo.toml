[package]
name = "termrock-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Render context, reveal, tooltip, popup and column solver for the Termrock terminal UI library"
license = "MIT"

[lib]
doctest = false

[features]
default = []
work-metrics = ["termrock-core/work-metrics", "termrock-metrics/work-metrics"]

[dependencies]
ratatui = { workspace = true }
termrock-core = { workspace = true }
termrock-metrics = { workspace = true }
termrock-text = { workspace = true }
termrock-theme = { workspace = true }
