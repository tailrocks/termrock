min_version = { hard = "2026.11.1", soft = "2026.11.10" }

[tools]
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.151"
actionlint = "1.7.12"
shellcheck = "0.11.0"
zizmor = "1.32.0"
jactionlint = "2.6.0"
gh = "2.105.0"
hk = "2.13.0"
# velnor-gen (tools release tag). velnor-gen refuses a tool that applies on the
# runner OS without a prebuilt binary in mise.lock, and the release has no macOS
# asset (velnor-new plans one for tools-v0.1.108), so Linux takes the release
# asset and macOS builds that tag's commit from source (a `rev:`, not the
# movable tag; tests/ci_default_branch.rs ties it to .velnor/rust-ci.lock). `tuiscotti` is a source build
# too, so it is macOS only. Bump with `velnor-gen pin-helper <version>`.
"github:tailrocks/velnor-new" = { version = "tools-v0.1.106", asset_pattern = "velnor-gen-*-unknown-linux-musl.tar.gz", os = ["linux"] }
"cargo:https://github.com/tailrocks/velnor-new" = { version = "rev:1f9762b239202d138ceec484da17fa5b27f2c3a3", crate = "velnor-gen", os = ["macos"] }
"cargo:https://github.com/tailrocks/tuiscotti" = { version = "rev:f1fb3f276b8d49948881c07b3bbc619840b6cc93", crate = "tuiscotti-cli", os = ["macos"] }
mr-boxington = "1.30.0"
rust = { version = "1.100.0", profile = "minimal", components = [
  "clippy",
  "rustfmt",
], targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
], mr_boxington = true }

[settings]
cargo.binstall = true
idiomatic_version_file_enable_tools = ["rust"]
lockfile = true

[wrappers.cargo]
command = "mbx"
env = { MBX_CARGO_SHIM_MODE = "1" }

# `velnor-gen check` exits 1 when a generated workflow or .velnor/rust-metadata.json
# is out of date. Run locally by the hk pre-commit hook and in CI by the
# `lint-generated-workflows` job (docs/ci.md, "Generated workflow check").
[tasks.check-generated-workflows]
description = "Fail when .github/workflows/rust-ci.yml or .velnor/rust-metadata.json differs from velnor-gen output"
run = "velnor-gen --root . check"

# Builds every workspace member on its own, once with the features it declares
# as defaults and once with all of its features, and denies warnings. A
# workspace build unifies features across the members, so a member that lacks a
# feature forward, or leaves an import unused when a consumer leaves a feature
# off, still builds there; `cargo clippy --package <member>` resolves only that
# member's own dependency graph (the defects of #521 and #524). velnor-gen's own
# `Check <crate> alone` step is a default-feature `cargo check` without
# `-D warnings`, so it cannot catch either. Run by the `lint-crates-alone` CI
# job (docs/ci.md).
[tasks.check-crates-alone]
description = "Fail when a workspace member does not build, or warns, on its own with default or all features"
run = '''
set -eu
for package in $(cargo tree --workspace --depth 0 --prefix none --format '{p}' | awk 'NF { print $1 }'); do
  echo "== $package"
  cargo clippy --locked --package "$package" --all-targets -- -D warnings
  cargo clippy --locked --package "$package" --all-targets --all-features -- -D warnings
done
'''
