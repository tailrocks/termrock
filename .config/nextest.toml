experimental = ["setup-scripts"]

[test-groups]

pty = { max-threads = 8 }

[profile.default]
fail-fast = false
slow-timeout = { period = "60s" }

[[profile.default.overrides]]
filter = "binary(functional)"
test-group = "pty"
threads-required = 2
slow-timeout = { period = "30s", terminate-after = 3 }

[profile.functional]
default-filter = 'binary(functional)'
fail-fast = false

[profile.functional.junit]
path = "functional.xml"

[profile.ci]
# The functional binary is the Suite (functional) job. This profile is the
# Rust crate job, so it runs library, unit, and integration tests once.
default-filter = 'not binary(functional)'
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 10 }

# The deterministic cost contracts of #56 (docs/performance-contracts.md).
# Run with the work counters compiled in:
#   cargo nextest run --profile performance --workspace --all-features --no-tests fail
# The filter is a union of one operand per required suite. The inventory gate
# (tests/regressions/performance_inventory.rs) parses these operands, and under
# this profile asks `cargo nextest list --profile performance` what runs; it
# fails when a required suite or test is missing or ignored, so a suite cannot
# drop out of the profile quietly.
# Keep the operands to `binary_id(=...) & test(...)` terms joined by `|`.
[profile.performance]
default-filter = '''
    binary_id(=termrock-conformance) & test(/^metrics_tests::/)
  | binary_id(=termrock-metrics) & test(/^measurement::/)
  | binary_id(=junie-tui) & test(/^ui::overflow_work_tests::/)
  | binary_id(=junie-tui) & test(/^widgets::keyed_cost_tests::/)
  | binary_id(=junie-tui) & test(/^widgets::search_detail_cost_tests::/)
  | binary_id(=junie-tui::regressions) & test(/^work_budgets::/)
  | binary_id(=termrock-holla::bin/holla) & test(/^work_metrics_tests::/)
  | binary_id(=termrock-holla::bin/holla) & test(/holla_projection_/)
  | binary_id(=termrock-tablepro::bin/tablepro) & test(/^work_metrics_tests::/)
  | binary_id(=termrock-showcase::bin/showcase) & test(/^work_metrics_tests::/)
  | binary_id(=termrock-shell) & test(/^runtime::raw_input_tests::work::/)
  | binary_id(=jackin-console) & test(/^sim::link::tests::work::/)
  | binary_id(=jackin-console::regressions) & test(/^work_budgets::/)
  | binary_id(=jackin-console::world) & test(/^projection_work::/)
  | binary_id(=junie-tui::regressions) & test(=work_measurements::measurement_edit_samples_are_real_changes)
  | binary_id(=junie-tui::regressions) & test(/^performance_inventory::/)
'''
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 10 }

# Elapsed-time measurements. They are #[ignore]d and meaningless in a debug
# build, so run them only through scripts/measure-performance.sh. One test at a
# time: parallel tests would time each other.
[profile.performance-measure]
default-filter = 'binary_id(=junie-tui::regressions) & test(/^work_measurements::measurement_/) & not test(=work_measurements::measurement_edit_samples_are_real_changes)'
fail-fast = false
test-threads = 1
slow-timeout = { period = "120s", terminate-after = 5 }

# Builds the binaries the functional-cross cases and the root functional
# journeys launch, with the feature set of this run (scripts/build-app-bins.sh),
# and exports TCB_BIN_<NAME> and, unless scripts/run_functional.py already did,
# TERMROCK_TEST_<NAME>.
[scripts.setup.app-bins]
command = ["sh", "scripts/build-app-bins.sh"]
slow-timeout = { period = "120s", terminate-after = 2 }

[[profile.default.scripts]]
filter = "package(functional-cross) | package(termrock-functional)"
setup = "app-bins"
