[package]
name = "termrock-showcase"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Showcase, the catalog of every termrock component"
license = "MIT"
publish = false
default-run = "showcase"

[[bin]]
name = "showcase"
path = "src/main.rs"

[features]
default = []
work-metrics = ["termrock/work-metrics"]

[dependencies]
termrock = { path = "../../crates/termrock", default-features = false, features = ["cli", "terminal"] }
clap = { workspace = true }
ratatui = { workspace = true }

[dev-dependencies]
syn = { version = "=3.0.10", features = ["full", "visit"] }
serde_json = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
libc = "=0.2.191"
