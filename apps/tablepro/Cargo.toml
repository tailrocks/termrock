[package]
name = "termrock-tablepro"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "TablePro, a database client built from the termrock components"
license = "MIT"
publish = false
default-run = "tablepro"

[[bin]]
name = "tablepro"
path = "src/main.rs"

[[test]]
name = "functional"
path = "tests/functional/main.rs"

[features]
default = []
work-metrics = ["termrock/work-metrics"]

[dependencies]
termrock = { path = "../../crates/termrock", default-features = false, features = ["cli"] }
clap = { workspace = true }
ratatui = { workspace = true }
regex = "1.13"

[dev-dependencies]
tui-test = { workspace = true }
tuiscotti-latest = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
