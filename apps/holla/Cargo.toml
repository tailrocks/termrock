[package]
name = "termrock-holla"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Holla, a Ratatui journey app built on the termrock components"
license = "MIT"
publish = false

[[bin]]
name = "holla"
path = "src/main.rs"

[features]
default = []
product = []

[dependencies]
junie_tui = { package = "termrock", path = "../../crates/termrock", default-features = false, features = ["cli"] }
clap = { workspace = true }
ratatui = { workspace = true }
serde_json = { workspace = true }
unicode-segmentation = "1"
