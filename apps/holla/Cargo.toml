[package]
name = "termrock-holla"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Holla, a Ratatui journey app built on the termrock components"
license = "MIT"
publish = false

[[bin]]
name = "holla"
path = "src/main.rs"

[features]
default = []
product = []

[dependencies]
termrock = { path = "../../crates/termrock", default-features = false, features = ["cli"] }
clap = { workspace = true }
ratatui = { workspace = true }
serde_json = { workspace = true }
unicode-segmentation = "1"

[[test]]
name = "functional"
path = "tests/functional/main.rs"

[dev-dependencies]
tui-test = { workspace = true }
tuiscotti-latest = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
